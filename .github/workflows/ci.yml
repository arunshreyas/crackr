name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build production application
        run: npm run build
        env:
          # Build-time placeholders only; CI never connects to a database or Clerk.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/crackrr_ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/crackrr_ci
